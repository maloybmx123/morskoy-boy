/* Макет: морская карта — сетка-градусник на фоне, поля как листы карты, сигнальный жёлтый флаг для «вашего хода» */
:root{
  --bg:#e7eef1; --ink:#13283a; --water:#d2e4ed; --grid:#9bb9ca; --ship:#3c4f60;
  --hit:#d13d2a; --miss:#5d7c93; --accent:#0d6896; --on-accent:#ffffff; --flag:#f0b400; --on-flag:#1d1600; --ok:#2f8a57;
  --surface:color-mix(in srgb,var(--ink) 4%,var(--bg));
  --surface2:color-mix(in srgb,var(--ink) 8%,var(--bg));
  --line:color-mix(in srgb,var(--ink) 17%,var(--bg));
  --muted:color-mix(in srgb,var(--ink) 60%,var(--bg));
  --f-display:"Russo One","Arial Black",Impact,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --fs:15px; --cellPref:34px; --si:9%; --lab:20px; --radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1925; --ink:#e1ebf2; --water:#0f2738; --grid:#2c4960; --ship:#9fb3c4;
  --hit:#ff5b42; --miss:#6d8ca4; --accent:#53b6e3; --on-accent:#03121c; --flag:#ffc83a; --on-flag:#1d1600; --ok:#4cc27e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1925; --ink:#e1ebf2; --water:#0f2738; --grid:#2c4960; --ship:#9fb3c4;
  --hit:#ff5b42; --miss:#6d8ca4; --accent:#53b6e3; --on-accent:#03121c; --flag:#ffc83a; --on-flag:#1d1600; --ok:#4cc27e; color-scheme:dark}
html,body{min-height:100%}
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.net{width:9px;height:9px;border-radius:50%;flex:none}.net.on{background:var(--ok)}.net.off{background:var(--hit)}
textarea.inp{resize:vertical}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.45;
  background-image:linear-gradient(color-mix(in srgb,var(--ink) 5%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--ink) 5%,transparent) 1px,transparent 1px);
  background-size:64px 64px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}

.msg.me .mt{background:var(--accent);color:var(--on-accent);border-radius:14px 14px 4px 14px}
.aud{display:flex;align-items:center;gap:10px;background:var(--surface2);border:0;border-radius:22px;padding:6px 14px 6px 6px;cursor:pointer;min-width:190px;font-variant-numeric:tabular-nums}
.aud .pb{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:.8rem;flex:none}
.aud .abar{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.aud .abar i{display:block;height:100%;width:0;background:var(--accent)}
.vcircle{position:relative;width:min(190px,55vw);aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid var(--accent);padding:0;background:#0b1620;cursor:pointer;display:block}
.vcircle video{width:100%;height:100%;object-fit:cover;display:block}
.vcircle .vplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;background:rgba(0,0,0,.28)}
.vcircle.playing .vplay{display:none}
.vcircle .vdur{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;border-radius:10px;padding:1px 8px;font-variant-numeric:tabular-nums}
.loading{opacity:.6}
.chcomp{display:flex;gap:6px;align-items:center;padding:8px;border-top:1px solid var(--line)}
.chcomp .inp{flex:1;min-width:0}
.chcomp .ibtn{padding:8px;flex:none}
.recbar{display:flex;align-items:center;gap:10px;flex:1;min-height:40px;padding-left:6px}
.recbar .sp{flex:1}
.recdot{width:12px;height:12px;border-radius:50%;background:var(--hit);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.vrec{position:fixed;inset:0;z-index:75;background:rgba(5,12,18,.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.vrec .vtitle{font-weight:700}
.vrec .ring{position:relative;width:min(70vw,48vh,320px);aspect-ratio:1}
.vrec video{position:absolute;inset:7%;width:86%;height:86%;border-radius:50%;object-fit:cover;background:#000}
.vrec video.mirror{transform:scaleX(-1)}
.vrec svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.vrec .vtime{font-size:1.2rem}
.vrec .ctr{display:flex;gap:18px;align-items:center}
.vrec .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.vrec .vhint{font-size:.85rem;opacity:.75;text-align:center}
.recbtn{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#ff5b42;cursor:pointer;transition:border-radius .2s}
.recbtn.on{border-radius:22px;background:#ff5b42;box-shadow:0 0 0 6px rgba(255,91,66,.35)}
.dragtip{position:fixed;z-index:85;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:700;font-size:.85rem;padding:6px 12px;border-radius:12px;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 18px rgba(0,0,0,.25)}

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function deepMerge(t, p){ for(const k in p){ const v=p[k]; if(v && typeof v === "object" && !Array.isArray(v) && t[k] && typeof t[k] === "object" && !Array.isArray(t[k])) deepMerge(t[k], v); else t[k] = v; } return t; }
function lum(hex){ const m = /^#?([0-9a-f]{6})$/i.exec(hex||""); if(!m) return 0.5; const n=parseInt(m[1],16); const r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255; return 0.2126*r+0.7152*g+0.0722*b; }
function genCode(){ const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<5;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }

function normG(g){

  g.cfg = Object.assign(clone(DEFAULT_CFG), g.cfg||{}); g.cfg.fleet = Object.assign({l1:0,l2:0,l3:0,l4:0,l5:0}, (g.cfg&&g.cfg.fleet)||{});
  g.order = arr(g.order); g.log = arr(g.log); g.results = arr(g.results);
  g.boards = g.boards || {}; Object.keys(g.boards).forEach(p=>{ const b=g.boards[p]; b.sunk = arr(b.sunk).map(arr); b.dead=!!b.dead; b.place=b.place||0; });
  g.stats = g.stats || {}; g.names = g.names || {};

/* ================= логика поля ================= */
function fleetLens(cfg){ const a=[]; for(let L=5;L>=1;L--) for(let k=0;k<(cfg.fleet["l"+L]||0);k++) a.push(L); return a; }
function fleetCells(cfg){ return fleetLens(cfg).reduce((s,x)=>s+x,0); }
function shipCells(n, at, len, horiz){ const r=Math.floor(at/n), c=at%n, out=[]; for(let k=0;k<len;k++){ const rr=horiz?r:r+k, cc=horiz?c+k:c; if(rr>=n||cc>=n) return null; out.push(rr*n+cc); } return out; }
function around(n, cells){ const set=new Set(); cells.forEach(i=>{ const r=Math.floor(i/n), c=i%n; for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){ const rr=r+dr, cc=c+dc; if(rr>=0&&cc>=0&&rr<n&&cc<n) set.add(rr*n+cc); } }); cells.forEach(i=>set.delete(i)); return [...set]; }
function placeOk(n, ships, cells, touch, ignore){ const occ=new Set(); ships.forEach((s,i)=>{ if(i!==ignore && s.cells) s.cells.forEach(c=>occ.add(c)); }); if(cells.some(c=>occ.has(c))) return false; if(!touch && around(n,cells).some(c=>occ.has(c))) return false; return true; }
function randomFleet(cfg, tries){ const n=cfg.size, lens=fleetLens(cfg); tries = tries||60;
  for(let t=0;t<tries;t++){ const ships=[]; let ok=true;
    for(const len of lens){ let placed=false;
      for(let a=0;a<400;a++){ const horiz=Math.random()<.5, at=Math.floor(Math.random()*n*n), cells=shipCells(n,at,len,horiz);
        if(cells && placeOk(n,ships,cells,cfg.touch,-1)){ ships.push({len,cells}); placed=true; break; } }
      if(!placed){ ok=false; break; } }
    if(ok) return ships; }
  return null; }
const fitCache = {};
function cfgFits(cfg){ const k=JSON.stringify([cfg.size,cfg.fleet,cfg.touch]); if(!(k in fitCache)) fitCache[k] = fleetLens(cfg).length>0 && !!randomFleet(cfg, 30); return fitCache[k]; }
function joins(n, cells){ const set=new Set(cells), map={}; cells.forEach(i=>{ const r=Math.floor(i/n), c=i%n, j=[];
  if(c>0 && set.has(i-1)) j.push("jl"); if(c<n-1 && set.has(i+1)) j.push("jr"); if(r>0 && set.has(i-n)) j.push("ju"); if(r<n-1 && set.has(i+n)) j.push("jd"); map[i]=j.join(" "); }); return map; }
function remainingLens(g, pid){ const lens=fleetLens(g.cfg); (g.boards[pid].sunk||[]).forEach(s=>{ const k=lens.indexOf(s.length); if(k>=0) lens.splice(k,1); }); return lens; }

function fkey(code,pid){ return "mb|"+code+"|"+pid+"|kelp"; }
function enc(obj,key){ const s=JSON.stringify(obj); let o=""; for(let i=0;i<s.length;i++) o+=String.fromCharCode(s.charCodeAt(i)^key.charCodeAt(i%key.length)); return btoa(o); }
function dec(str,key){ const s=atob(str); let o=""; for(let i=0;i<s.length;i++) o+=String.fromCharCode(s.charCodeAt(i)^key.charCodeAt(i%key.length)); return JSON.parse(o); }

/* ================= ход ================= */
function curPid(g){ return g.order[g.turnIdx]; }
function nick(g,p){ return (g.names && g.names[p] && g.names[p].nick) || (S && S.players && S.players[p] && S.players[p].nick) || "Игрок"; }
function pcolor(g,p){ return (g.names && g.names[p] && g.names[p].color) || (S && S.players && S.players[p] && S.players[p].color) || "#888"; }
function advance(g){ const n=g.order.length; for(let k=1;k<=n;k++){ const i=(g.turnIdx+k)%n; if(!g.boards[g.order[i]].dead){ g.turnIdx=i; break; } } g.turnSeq=(g.turnSeq||0)+1; g.turnStartedAt=Date.now(); g.shotsLeft=g.cfg.shots; }
function finish(g, winner){ g.status="finished"; g.winner=winner||null; g.finishedAt=Date.now(); if(winner) g.boards[winner].place=1;
  g.results = g.order.map(p=>{ const st=g.stats[p]||{}; return {id:p, nick:nick(g,p), color:pcolor(g,p), bot:!!(g.names[p]&&g.names[p].bot), place:p===winner?1:(g.boards[p].place||g.order.length), shots:st.shots||0, hits:st.hits||0, sunk:st.sunk||0}; }).sort((a,b)=>a.place-b.place); }
function applyShot(g0, fleets, by, target, idx){
  const g = clone(g0), b = g.boards[target], n = g.cfg.size;
  if(!b) return null; const m = b.m.split("");
  if(m[idx] !== ".") return null;
  const fleet = fleets[target]; if(!fleet) return null;
  const st = g.stats[by] || (g.stats[by] = {shots:0,hits:0,sunk:0}); st.shots=(st.shots||0)+1;
  let r = "miss", len = 0; const ship = fleet.find(s=>s.cells.includes(idx));
  if(!ship){ m[idx]="o"; }
  else { m[idx]="x"; st.hits=(st.hits||0)+1; r="hit"; len=ship.len;
    if(ship.cells.every(c=>m[c]==="x"||m[c]==="#")){ r="sunk"; st.sunk=(st.sunk||0)+1; ship.cells.forEach(c=>m[c]="#"); b.sunk=(b.sunk||[]).concat([ship.cells]);
      if(g.cfg.autoMark) around(n, ship.cells).forEach(c=>{ if(m[c]===".") m[c]="-"; }); } }
  b.m = m.join("");
  if(r==="sunk" && (b.sunk||[]).length >= fleet.length){ b.dead=true; const alive=g.order.filter(p=>!g.boards[p].dead).length; b.place=alive+1; }
  g.lastShot = {seq:((g0.lastShot&&g0.lastShot.seq)||0)+1, by, target, c:idx, r, len};
  g.log = (g.log||[]).slice(-79).concat([{t:Date.now(), by, target, c:idx, r, len}]);
  const alive = g.order.filter(p=>!g.boards[p].dead);
  if(alive.length<=1){ finish(g, alive[0]); return {g, r}; }
  const again = r!=="miss" && g.cfg.extraOnHit;
  if(!again) g.shotsLeft = (g.shotsLeft||1) - 1;
  if(g.shotsLeft<=0) advance(g);
  return {g, r};
}
function skipTurn(g0){ const g=clone(g0); const who=curPid(g); g.log=(g.log||[]).slice(-79).concat([{t:Date.now(), sys:"skip", by:who}]); advance(g); return g; }

/* ================= бот ================= */
function botChoose(g, bot, diff){
  const n=g.cfg.size; const opp=g.order.filter(p=>p!==bot && !g.boards[p].dead);
  let target = diff!=="easy" ? opp.find(p=>g.boards[p].m.includes("x")) : null;
  if(!target) target = pick(opp);
  const m=g.boards[target].m; const unknown=[]; for(let i=0;i<m.length;i++) if(m[i]===".") unknown.push(i);
  if(diff==="easy" || !unknown.length) return [target, pick(unknown)];
  const hits=[]; for(let i=0;i<m.length;i++) if(m[i]==="x") hits.push(i);
  const nb4 = i=>{ const r=Math.floor(i/n), c=i%n, o=[]; if(c>0)o.push(i-1); if(c<n-1)o.push(i+1); if(r>0)o.push(i-n); if(r<n-1)o.push(i+n); return o; };
  if(hits.length){ let cand=[];
    if(hits.length>=2){ const s=hits.slice().sort((a,b)=>a-b); const row=Math.floor(s[0]/n);
      if(s.every(h=>Math.floor(h/n)===row)){ const a=s[0]-1, b=s[s.length-1]+1; if(a>=0 && Math.floor(a/n)===row && m[a]===".") cand.push(a); if(b<n*n && Math.floor(b/n)===row && m[b]===".") cand.push(b); }
      else if(s.every(h=>h%n===s[0]%n)){ const a=s[0]-n, b=s[s.length-1]+n; if(a>=0 && m[a]===".") cand.push(a); if(b<n*n && m[b]===".") cand.push(b); } }
    if(!cand.length) hits.forEach(h=>nb4(h).forEach(c=>{ if(m[c]===".") cand.push(c); }));
    if(cand.length) return [target, pick(cand)]; }
  if(diff==="hard"){ const lens=remainingLens(g,target); const score=new Array(n*n).fill(0);
    lens.forEach(L=>{ for(let i=0;i<n*n;i++) for(const h of [true,false]){ const cells=shipCells(n,i,L,h); if(cells && cells.every(c=>m[c]===".")) cells.forEach(c=>score[c]++); } });
    let best=-1, ar=[]; unknown.forEach(i=>{ if(score[i]>best){ best=score[i]; ar=[i]; } else if(score[i]===best) ar.push(i); });
    return [target, pick(ar)]; }
  const par = unknown.filter(i=>((Math.floor(i/n)+i%n)%2)===0);
  return [target, pick(par.length?par:unknown)];
}

/* ================= звук ================= */
const sfx = (()=>{ let ctx=null, out=null, nb=null;
  function A(){ if(!SET.sound) return null; try{ if(!ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; ctx=new C(); out=ctx.createGain(); out.connect(ctx.destination); } if(ctx.state==="suspended") ctx.resume(); out.gain.value=SET.volume; return ctx; }catch(e){ return null; } }
  function tone(f,d,o){ o=o||{}; const a=A(); if(!a) return; const t=a.currentTime+(o.delay||0); const os=a.createOscillator(), g=a.createGain(); os.type=o.type||"sine"; os.frequency.setValueAtTime(f,t); if(o.to) os.frequency.exponentialRampToValueAtTime(o.to,t+d); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(o.g||0.25,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+d); os.connect(g); g.connect(out); os.start(t); os.stop(t+d+0.05); }
  function buf(a){ if(nb) return nb; const len=a.sampleRate*2; nb=a.createBuffer(1,len,a.sampleRate); const d=nb.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; return nb; }
  function noise(d,o){ o=o||{}; const a=A(); if(!a) return; const t=a.currentTime+(o.delay||0); const s=a.createBufferSource(); s.buffer=buf(a); const f=a.createBiquadFilter(); f.type=o.type||"lowpass"; f.frequency.setValueAtTime(o.f||1000,t); if(o.to) f.frequency.exponentialRampToValueAtTime(o.to,t+d); f.Q.value=o.q||0.8; const g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(o.g||0.5,t+(o.att||0.01)); g.gain.exponentialRampToValueAtTime(0.0001,t+d); s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t+d+0.05); }
  return {
    unlock(){ A(); },
    shot(){ if(SET.sndShot) noise(0.22,{f:3200,to:500,type:"bandpass",q:1.3,g:0.22}); },
    miss(){ if(!SET.sndHit) return; noise(0.65,{f:1700,to:260,g:0.32,att:0.06,delay:0.12}); tone(540,0.28,{to:250,g:0.05,delay:0.12}); },
    hit(){ if(!SET.sndHit) return; noise(0.75,{f:900,to:70,g:0.85,delay:0.1}); tone(95,0.55,{to:38,g:0.5,delay:0.1}); },

/* ================= визуальные эффекты ================= */
const FX = (()=>{ let cv=null, cx=null, parts=[], running=false;
  function setup(){ if(cv) return; cv=$("#fx"); cx=cv.getContext("2d"); size(); addEventListener("resize", size); }
  function size(){ const d=devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; }
  function loop(){ const d=devicePixelRatio||1; cx.clearRect(0,0,cv.width,cv.height); parts=parts.filter(p=>p.life>0);
    for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=p.fr; p.life--; const a=Math.max(0,p.life/p.max); cx.globalAlpha=a; cx.fillStyle=p.col;
      if(p.sq){ cx.save(); cx.translate(p.x*d,p.y*d); cx.rotate(p.rot+=p.vr); cx.fillRect(-p.s*d/2,-p.s*d/4,p.s*d,p.s*d/2); cx.restore(); }
      else { cx.beginPath(); cx.arc(p.x*d,p.y*d,p.s*d*(0.4+a*0.6),0,Math.PI*2); cx.fill(); } }
    cx.globalAlpha=1; if(parts.length) requestAnimationFrame(loop); else { running=false; cx.clearRect(0,0,cv.width,cv.height); } }
  function go(){ if(!running){ running=true; requestAnimationFrame(loop); } }
  function burst(x,y,o){ setup(); const k=SET.fxIntensity; for(let i=0;i<Math.round(o.n*k);i++){ const ang=Math.random()*Math.PI*2, sp=(0.5+Math.random())*o.sp*Math.sqrt(k); parts.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-(o.up||0),g:o.g||0.12,fr:0.97,s:o.s[0]+Math.random()*(o.s[1]-o.s[0]),life:o.life+Math.random()*20,max:o.life+20,col:pick(o.cols)}); } go(); }
  function center(el){ const r=el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }
  function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || "#f60"; }
  return {
    explode(el, big){ if(!SET.fx || !SET.fxExplode || !el) return; const [x,y]=center(el); const hit=css("--hit"), flag=css("--flag");
      burst(x,y,{n:big?70:34, sp:big?5.5:3.6, s:[2,big?6:4.5], life:big?55:38, cols:[hit,flag,"#ffd27a","#ff8a3d"], up:1});
      burst(x,y,{n:big?26:12, sp:1.2, s:[4,9], life:60, g:-0.03, cols:["rgba(80,80,80,.55)","rgba(120,120,120,.4)"]}); },
    splash(el){ if(!SET.fx || !el) return; if(SET.fxRipple){ const s=document.createElement("span"); s.className="rip"; el.appendChild(s); setTimeout(()=>s.remove(),750); }
      if(SET.fxExplode){ const [x,y]=center(el); burst(x,y,{n:14, sp:2.2, s:[1.5,3], life:30, cols:[css("--miss"),css("--water"),"#cfe9ff"], up:2.2, g:0.16}); } },
    shake(el){ if(!SET.fx || !SET.fxShake || !el) return; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); },
    confetti(){ if(!SET.fx || !SET.fxConfetti) return; setup(); const cols=[css("--accent"),css("--flag"),css("--hit"),css("--ok"),"#ffffff"];
      for(let i=0;i<Math.round(160*SET.fxIntensity);i++) parts.push({x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*0.4, vx:(Math.random()-.5)*2, vy:2+Math.random()*3, g:0.04, fr:0.995, s:6+Math.random()*6, sq:true, rot:Math.random()*6, vr:(Math.random()-.5)*0.3, life:180+Math.random()*80, max:260, col:pick(cols)}); go(); }
  }; })();

let BE=null, BE_CFG=null, NET_OK=null, S=null, OVL=null, BOOTED=false;
const GP = code => "mb1/games/"+code;
function parseFbConfig(txt){
  if(!txt) return null; let o=null;
  try{ o=JSON.parse(txt); }catch(e){ o={}; const re=/([A-Za-z]+)\s*:\s*["'`]([^"'`]+)["'`]/g; let m; while((m=re.exec(txt))) o[m[1]]=m[2]; }
  if(!o || !o.databaseURL){ const m=/https:\/\/[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)/i.exec(txt); if(m) o={databaseURL:m[0]}; }
  return o && o.databaseURL ? o : null; }
function makeFirebase(cfg){
  const F = window.FB; const app = F.initializeApp(cfg, "mb-"+Date.now()); const db = F.getDatabase(app);
  const R = p => F.ref(db, p);
  return {
    get: async p => (await F.get(R(p))).val(),
    set: (p,v) => F.set(R(p), v),
    update: (p,v) => F.update(R(p), v),
    remove: p => F.remove(R(p)),
    listen(p, cb){ return F.onValue(R(p), s=>cb(s.val()), e=>console.warn("listen", p, e)); },
    async transact(p, fn){ const r = await F.runTransaction(R(p), fn); return {committed:r.committed, value:r.snapshot.val()}; },
    presence(p){ const unsub = F.onValue(R(".info/connected"), s=>{ if(s.val()===true){ F.onDisconnect(R(p)).remove().then(()=>F.set(R(p), true)).catch(()=>{}); } });
      return ()=>{ unsub(); F.onDisconnect(R(p)).cancel().catch(()=>{}); F.remove(R(p)).catch(()=>{}); }; },
    connected(cb){ return F.onValue(R(".info/connected"), s=>cb(!!s.val())); },
    pushKey(p){ return F.push(R(p)).key; },
    listenLast(p, n, cb){ return F.onValue(F.query(R(p), F.limitToLast(n)), s=>cb(s.val()), e=>console.warn("listen", p, e)); }
  };
}
function backendInit(){
  if(window.MB_TEST_BACKEND){ BE=window.MB_TEST_BACKEND; BE_CFG={databaseURL:"test"}; NET_OK=true; return; }
  const cfg = LS.get("mb.fbcfg", null) || FIREBASE_CONFIG;
  if(!cfg || !cfg.databaseURL || !window.FB){ BE=null; BE_CFG=null; return; }
  try{ BE = makeFirebase(cfg); BE_CFG = cfg; let first=true;
    BE.connected(ok=>{ NET_OK=ok; netDot(); if(ok && first){ first=false; if(!S) fillMyGames(); } });
    setTimeout(()=>{ if(NET_OK===null){ NET_OK=false; netDot(); } }, 8000);
  }catch(e){ console.warn(e); BE=null; BE_CFG=null; }
}

    for(let c=0;c<n;c++){ const i=r*n+c, ch=m[i]; let cls="c";

function ensurePlace(){
  const g=S.game; if(S.place && S.placeVer===g.cfgVer) return;
  const lens=fleetLens(g.cfg); let ships=lens.map(len=>({len, cells:null}));
  const saved = S.myFleet && S.myFleet.cfgVer===g.cfgVer ? S.myFleet.ships : null;
  if(saved && saved.length===ships.length) ships = saved.map(s=>({len:s.len, cells:arr(s.cells).slice()}));
  if(S.place && S.placeVer!==undefined && S.placeVer!==g.cfgVer && S.mode==="online" && !isHost()) toast("Правила изменились — расставьте флот заново");
  S.place={ships, sel:ships.findIndex(s=>!s.cells), horiz:true}; S.placeVer=g.cfgVer;
}

function logLine(g,e){ const n=g.cfg.size;

/* ================= партия по сети ================= */
function newGameDoc(code, cfg){ return {code, host:ME.pid, createdAt:Date.now(), status:"lobby", cfg:clone(cfg), cfgVer:1, order:[], turnIdx:0, turnSeq:0, turnStartedAt:0, shotsLeft:1, boards:{}, stats:{}, lastShot:null, log:[], names:{}, winner:null, finishedAt:0, results:[], rematch:null}; }
function rememberGame(code){ const l=LS.get("mb.games",[]).filter(x=>x.code!==code); l.unshift({code, at:Date.now()}); LS.set("mb.games", l.slice(0,20)); PLAT.syncGames(); }
function needNick(){ const el=$("#nickIn"); if(el){ ME.nick=el.value.trim().slice(0,18); saveMe(); } if(!ME.nick){ toast("Введите имя капитана","err"); el&&el.focus(); return true; } return false; }
function writeErr(e){ console.warn(e); const m=String((e&&(e.code||e.message))||"");
  if(/permission|PERMISSION_DENIED/i.test(m)) toast("Сервер не принял запись. Проверьте правила базы в Firebase.","err");
  else toast("Нет связи с сервером, действие не сохранено. Попробуйте ещё раз.","err"); }
async function newCode(){ for(let k=0;k<8;k++){ const c=genCode(); const v=await BE.get(GP(c)+"/g"); if(!v) return c; } return genCode(); }

async function createRoom(){
  if(needNick() || !BE) return;
  try{ const code=await newCode(); const cfg=Object.assign(clone(DEFAULT_CFG), LS.get("mb.lastcfg",{}));
    await BE.set(GP(code)+"/g", newGameDoc(code,cfg)); await openGame(code); }catch(e){ writeErr(e); }
}
async function openGame(code){
  if(!BE){ toast("Сервер для игры по сети не настроен","err"); return; }
  code=String(code||"").toUpperCase().trim();
  if(!/^[A-Z0-9]{5}$/.test(code)){ toast("Код — 5 латинских букв и цифр","err"); return; }
  if(!ME.nick){ const el=$("#nickIn"); ME.nick=(el && el.value.trim().slice(0,18)) || ("Капитан "+Math.floor(Math.random()*90+10)); saveMe(); }
  if(S) closeGame();
  const loading = setTimeout(()=>toast("Подключаюсь к комнате…"), 600);
  try{
    const g=normG(await BE.get(GP(code)+"/g"));
    if(!g){ toast("Комната "+code+" не найдена","err"); return; }
    const pl=(await BE.get(GP(code)+"/p")) || {};
    if(!pl[ME.pid] && g.status==="lobby"){
      if(Object.keys(pl).length >= (g.cfg.maxPlayers||6)) toast("Комната заполнена — вы будете зрителем");
      else await BE.set(GP(code)+"/p/"+ME.pid, {nick:ME.nick, color:ME.color, ready:false, cfgVer:0, joinedAt:Date.now()});
    } else if(pl[ME.pid] && (pl[ME.pid].nick!==ME.nick || pl[ME.pid].color!==ME.color) && g.status==="lobby"){ await BE.update(GP(code)+"/p/"+ME.pid, {nick:ME.nick, color:ME.color}); }
    S={mode:"online", code, game:g, players:(await BE.get(GP(code)+"/p"))||{}, fleets:{}, myFleet:null, online:new Set([ME.pid]), unsub:[], seenNudge:LS.get("mb.nudge."+code,0)};
    rememberGame(code);
    try{ const f=await BE.get(GP(code)+"/f/"+ME.pid); if(f && f.d){ S.myFleet={cfgVer:f.cfgVer, ships:dec(f.d, fkey(code,ME.pid))}; } }catch(e){}
    if(g.status!=="lobby") await loadFleets();
    S.unsub.push(BE.listen(GP(code)+"/g", v=>{ const ng=normG(v); if(ng && S && S.code===code) onGame(ng); }));
    S.unsub.push(BE.listen(GP(code)+"/p", v=>{ if(!S||S.code!==code) return; S.players=v||{}; if(S.game.status==="lobby") render(); }));
    S.unsub.push(BE.listen(GP(code)+"/o", v=>{ if(!S||S.code!==code) return; const set=new Set([ME.pid, ...Object.keys(v||{})]); const changed=[...set].sort().join()!==[...S.online].sort().join(); S.online=set; if(changed && S.game.status!=="finished") render(); }));
    S.unsub.push(BE.presence(GP(code)+"/o/"+ME.pid));
    S.unsub.push(BE.listen(GP(code)+"/n/"+ME.pid, v=>{ if(!S||S.code!==code||!v) return; if(v.at>(S.seenNudge||0)){ S.seenNudge=v.at; LS.set("mb.nudge."+code, v.at); PLAT.markSeen(code+":n", v.at); const g=S.game; if(g.status==="playing" && curPid(g)===ME.pid && Date.now()-v.at<12*3600*1000) showNudge(v.by); } }));
    let firstR=true; S.unsub.push(BE.listen(GP(code)+"/r", v=>{ if(!S||S.code!==code) return; if(firstR){ firstR=false; S.lastReact=v&&v.id; return; } if(!v || v.id===S.lastReact) return; S.lastReact=v.id; const e=REACTS[v.k|0]; if(e && Date.now()-v.at<20000) showBubble(nick(S.game, v.by), e); }));
    chatInit(code);
    render(); window.scrollTo(0,0);
  }catch(e){ writeErr(e); }
  finally{ clearTimeout(loading); }
}
async function loadFleets(){ if(!S || S.mode!=="online") return; try{ const all=(await BE.get(GP(S.code)+"/f"))||{}; Object.keys(all).forEach(p=>{ try{ S.fleets[p]=dec(all[p].d, fkey(S.code,p)).map(s=>({len:s.len, cells:arr(s.cells)})); }catch(e){} }); if(S.fleets[ME.pid] && !S.myFleet) S.myFleet={cfgVer:S.game.cfgVer, ships:S.fleets[ME.pid]}; }catch(e){ console.warn(e); } }
function closeGame(){ if(!S) return; chatClose(); stopRec(false); closeVideoRec(); S.unsub.forEach(u=>{ try{ u&&u(); }catch(e){} }); clearTimeout(S.botTimer); S=null; document.title="Морской бой"; }

/* ---- реакция на изменения партии ---- */
function onGame(g){
  const prev=S.game; S.game=g;
  if(prev.status==="lobby" && g.status==="playing"){ if(S.mode==="online") loadFleets().then(()=>{ if(S) render(); }); sfx.turn(); toast("Бой начался!","go"); }
  render();
  const ls=g.lastShot, pls=prev.lastShot;
  if(ls && (!pls || ls.seq!==pls.seq) && g.status!=="lobby") playShot(ls);
  if(S.mode==="online" && !PLAT.inBackground()){ if(g.status==="playing" && curPid(g)===ME.pid) PLAT.markSeen(S.code+":t", g.turnSeq); if(g.status==="finished") PLAT.markSeen(S.code+":f", 1); }
  if(g.status==="playing" && curPid(g)===ME.pid && (prev.turnSeq!==g.turnSeq || prev.status!=="playing")){
    if(!(ls && ls.by===ME.pid)){ setTimeout(()=>{ sfx.turn(); vib([60,40,60]); },350); toast("Ваш ход!","go"); }
    if(S.mode==="online" && PLAT.inBackground()) PLAT.notify("Морской бой — ваш ход", `Комната ${S.code}: ${ls&&ls.by!==ME.pid?nick(g,ls.by)+" "+(ls.r==="miss"?"промахнулся":"попал")+". ":""}Ваша очередь стрелять.`, S.code);
    flashTitle(); }
  if(g.status==="finished" && prev.status!=="finished"){
    setTimeout(()=>{ if(g.winner===ME.pid){ sfx.win(); FX.confetti(); } else sfx.lose(); },700);
    if(S.mode==="bot"){ const bs=LS.get("mb.botstat",{games:0,wins:0}); bs.games++; if(g.winner===ME.pid) bs.wins++; LS.set("mb.botstat",bs); }
    if(S.mode==="online" && PLAT.inBackground()) PLAT.notify("Морской бой — бой окончен", g.winner===ME.pid?"Победа! Ваш флот на плаву.":"Победил "+nick(g,g.winner), S.code); }
  if(g.status==="finished" && S.mode==="online" && !S.resWritten && g.order.includes(ME.pid)){ S.resWritten=true; const code=S.code;
    BE.transact("mb1/results/"+code, cur=>cur ? undefined : {finishedAt:g.finishedAt||Date.now(), results:g.results}).catch(e=>console.warn(e)); }
  if(S.mode==="bot") scheduleBot();
}
function playShot(ls){
  const el=document.querySelector(`.board[data-pid="${CSS.escape(ls.target)}"] .c[data-i="${ls.c}"]`);
  const card = el && el.closest(".panel");
  if(ls.r==="miss"){ sfx.miss(); FX.splash(el); }
  else if(ls.r==="hit"){ sfx.hit(); FX.explode(el,false); vib(40); }
  else { sfx.sunk(); FX.explode(el,true); FX.shake(card); vib([80,50,120]);
    toast(ls.target===ME.pid ? `Ваш ${ls.len}-палубный потоплен` : `${nick(S.game,ls.by)} топит ${ls.len}-палубный`, ls.target===ME.pid?"err":""); }
}
let titleTimer=null;
function flashTitle(){ if(!document.hidden) return; clearInterval(titleTimer); let on=false; titleTimer=setInterval(()=>{ document.title = (on=!on) ? "● Ваш ход!" : "Морской бой"; if(!document.hidden){ clearInterval(titleTimer); document.title="Морской бой"; } },900); }
function showNudge(by){ const old=$(".nudge"); if(old) old.remove(); const d=document.createElement("div"); d.className="nudge"; d.setAttribute("role","alert");
  const who = (S && S.game && nick(S.game, by)) || "Соперник";
  d.innerHTML=`<span style="flex:1"></span><button class="btn sm" data-act="dismiss">Понял</button>`; d.firstChild.textContent=`${who} напоминает: ваш ход!`;
  document.body.appendChild(d); sfx.bell(); vib([200,100,200,100,300]); flashTitle();
  if(PLAT.inBackground()) PLAT.notify("Морской бой — напоминание", `${who} напоминает: ваш ход в комнате ${S?S.code:""}`, S?S.code:"");
  setTimeout(()=>d.remove(),9000); }
function showBubble(name, e){ const b=document.createElement("div"); b.className="bubble"; b.textContent=name+" "+e; const tb=$("#turnbar"); const r=tb?tb.getBoundingClientRect():{left:innerWidth/2,bottom:120};
  b.style.left=Math.min(innerWidth-160, Math.max(10, r.left+20+Math.random()*Math.max(10,(tb?tb.offsetWidth:200)-180)))+"px"; b.style.top=(r.bottom+8)+"px"; document.body.appendChild(b); setTimeout(()=>b.remove(),2500); }

/* ================= действия ================= */
let wq=Promise.resolve();
function queue(fn){ wq=wq.then(fn).catch(writeErr); return wq; }
function pUpdate(data){
  if(S.mode==="bot"){ S.players[ME.pid]=Object.assign({}, S.players[ME.pid], data); render(); return Promise.resolve(); }
  return BE.update(GP(S.code)+"/p/"+ME.pid, data);
}
function editCfg(mut){
  if(!isHost() || S.game.status!=="lobby") return;
  const ng=clone(S.game); mut(ng.cfg); ng.cfg.size=Math.max(6,Math.min(15,ng.cfg.size)); ng.cfgVer=(ng.cfgVer||1)+1;
  LS.set("mb.lastcfg", ng.cfg);
  if(S.mode==="bot"){ S.game=ng; if(S.players[ME.pid]) S.players[ME.pid].ready=false; render(); return; }
  S.game=ng; render(); const code=S.code; queue(()=>BE.update(GP(code)+"/g", {cfg:ng.cfg, cfgVer:ng.cfgVer}));
}
/* ---- расстановка жестами: протянуть — поставить, нажать — повернуть, удерживать и тянуть — переместить ---- */
const PG={st:null};
function pRow(i){ return Math.floor(i/S.game.cfg.size); }
function pCol(i){ return i%S.game.cfg.size; }
function placeCellAt(board, x, y){ const first=board.querySelector('.c[data-i="0"]'); if(!first) return -1; const r=first.getBoundingClientRect(), n=S.game.cfg.size, cs=r.width||1;
  const c=Math.floor((x-r.left)/cs), rr=Math.floor((y-r.top)/cs); if(c<0||rr<0||c>=n||rr>=n) return -1; return rr*n+c; }
function freeLens(){ return S.place.ships.filter(s=>!s.cells).map(s=>s.len); }
function setHint(t){ let tip=$("#dragTip"); if(!t){ if(tip) tip.remove(); return; } if(!tip){ tip=document.createElement("div"); tip.id="dragTip"; tip.className="dragtip"; document.body.appendChild(tip); }
  tip.textContent=t; const st=PG.st; if(st && st.lx!=null){ tip.style.left=Math.min(innerWidth-12, Math.max(12, st.lx))+"px"; tip.style.top=Math.max(8, st.ly-64)+"px"; } }
function clearPreview(){ document.querySelectorAll(".place .pv-ok,.place .pv-bad,.place .ghost").forEach(x=>x.classList.remove("pv-ok","pv-bad","ghost")); }
function markCells(cells, cls){ cells.forEach(c=>{ const el=document.querySelector(`.place .c[data-i="${c}"]`); if(el) el.classList.add(cls); }); }
function drawCells(st){ st=st||PG.st; const n=S.game.cfg.size; const fl=freeLens(); const maxL=fl.length?Math.max.apply(null,fl):1;
  const ra=pRow(st.start), ca=pCol(st.start), rb=pRow(st.cur), cb=pCol(st.cur); const horiz=Math.abs(cb-ca)>=Math.abs(rb-ra);
  const d=horiz?(cb-ca):(rb-ra), sg=Math.sign(d)||1, len=Math.min(Math.abs(d)+1, Math.max(maxL,1)); const cells=[];
  for(let k=0;k<len;k++) cells.push(horiz ? ra*n+ca+sg*k : (ra+sg*k)*n+ca); return cells.sort((a,b)=>a-b); }
function moveCells(st){ st=st||PG.st; const n=S.game.cfg.size, ship=S.place.ships[st.ship]; const dr=pRow(st.cur)-pRow(st.start), dc=pCol(st.cur)-pCol(st.start); const out=[];
  for(const c of ship.cells){ const r=pRow(c)+dr, cc=pCol(c)+dc; if(r<0||cc<0||r>=n||cc>=n) return null; out.push(r*n+cc); } return out; }
function previewDraw(){ clearPreview(); const cells=drawCells(), fl=freeLens(), len=cells.length; const ok=fl.includes(len) && placeOk(S.game.cfg.size,S.place.ships,cells,S.game.cfg.touch,-1);
  markCells(cells, ok?"pv-ok":"pv-bad"); setHint(ok ? `${len}-палубный — отпустите, чтобы поставить` : !fl.includes(len) ? `${len}-палубных больше нет${fl.length?" — свободны: "+[...new Set(fl)].join(", ")+"-палубные":""}` : (S.game.cfg.touch?"Здесь занято":"Корабли не должны касаться друг друга")); }
function previewMove(){ clearPreview(); const st=PG.st, ship=S.place.ships[st.ship]; markCells(ship.cells,"ghost");
  if(st.out){ setHint("Отпустите за полем — корабль уберётся"); return; }
  const cells=moveCells(); const ok=!!cells && placeOk(S.game.cfg.size,S.place.ships,cells,S.game.cfg.touch,st.ship); if(cells) markCells(cells, ok?"pv-ok":"pv-bad");
  setHint(ok?"Отпустите, чтобы поставить сюда":"Сюда нельзя — двигайте дальше или утащите за поле"); }
function placeDown(e, board){
  if(!S || !S.place || !S.players[ME.pid] || S.game.status!=="lobby") return;
  if(readyOf(ME.pid)){ toast("Сначала нажмите «Изменить расстановку»"); return; }
  if(PG.st){ placeCancel(); return; }
  const i=placeCellAt(board, e.clientX, e.clientY); if(i<0) return;
  const si=S.place.ships.findIndex(sh=>sh.cells && sh.cells.includes(i));
  PG.st={id:e.pointerId, board, start:i, cur:i, ship:si, mode:"none", x:e.clientX, y:e.clientY, lx:e.clientX, ly:e.clientY, out:false, timer:null};
  try{ board.setPointerCapture(e.pointerId); }catch(_){}
  if(si>=0) PG.st.timer=setTimeout(()=>{ if(PG.st && PG.st.mode==="none"){ PG.st.mode="move"; vib(25); previewMove(); } }, 380);
  e.preventDefault();
}
function placeMove(e){ const st=PG.st; if(!st || e.pointerId!==st.id) return;
  st.lx=e.clientX; st.ly=e.clientY;
  const moved=Math.hypot(e.clientX-st.x, e.clientY-st.y); const i=placeCellAt(st.board, e.clientX, e.clientY);
  if(st.mode==="none"){ if(moved<8) return; if(st.ship>=0){ clearTimeout(st.timer); st.mode="skip"; setHint("Чтобы переместить корабль, сначала задержите на нём палец"); return; } st.mode="draw"; }
  if(st.mode==="skip") return;
  st.out = i<0; if(i>=0) st.cur=i;
  if(st.mode==="draw"){ if(i>=0) previewDraw(); } else if(st.mode==="move") previewMove();
}
function placeUp(e){ const st=PG.st; if(!st || e.pointerId!==st.id) return; clearTimeout(st.timer); PG.st=null; clearPreview(); setHint("");
  const P=S.place, n=S.game.cfg.size, touch=S.game.cfg.touch;
  if(st.mode==="none"){ if(st.ship>=0) rotateShip(st.ship, st.start); else tapEmpty(st.start); return; }
  if(st.mode==="draw"){ const cells=drawCells(st), len=cells.length, fl=freeLens();
    if(!fl.includes(len)){ toast(fl.length?`${len}-палубных больше нет. Свободны: ${[...new Set(fl)].join(", ")}-палубные`:"Все корабли уже на поле"); render(); return; }
    if(!placeOk(n,P.ships,cells,touch,-1)){ toast(touch?"Здесь занято":"Корабли не должны касаться друг друга"); render(); return; }
    const k=P.ships.findIndex(sh=>!sh.cells && sh.len===len); P.ships[k].cells=cells; vib(15); render(); return; }
  if(st.mode==="move"){ const ship=P.ships[st.ship];
    if(st.out){ ship.cells=null; toast("Корабль убран с поля"); render(); return; }
    const cells=moveCells(st); if(cells && placeOk(n,P.ships,cells,touch,st.ship)){ ship.cells=cells; vib(15); } else toast("Сюда корабль не встанет");
    render(); return; }
  render();
}
function placeCancel(){ if(PG.st){ clearTimeout(PG.st.timer); PG.st=null; clearPreview(); setHint(""); } }
function tapEmpty(i){ const P=S.place, n=S.game.cfg.size;
  if(freeLens().includes(1) && placeOk(n,P.ships,[i],S.game.cfg.touch,-1)){ const k=P.ships.findIndex(sh=>!sh.cells && sh.len===1); P.ships[k].cells=[i]; vib(15); render(); return; }
  toast("Проведите пальцем по клеткам — получится корабль такой длины"); }
function rotateShip(si, pivot){
  const P=S.place, n=S.game.cfg.size, sh=P.ships[si], cells=sh.cells.slice().sort((a,b)=>a-b), len=cells.length;
  if(len<2){ toast("Однопалубный поворачивать не нужно"); return; }
  const horiz=cells[1]-cells[0]===1, k=cells.indexOf(pivot), pr=pRow(pivot), pc=pCol(pivot);
  const offs=[]; for(let o=0;o<len;o++) offs.push(o); offs.sort((a,b)=>Math.abs(a-k)-Math.abs(b-k));
  for(const o of offs){ const nc=[];
    for(let t=0;t<len;t++){ const r=horiz ? pr-o+t : pr, c=horiz ? pc : pc-o+t; if(r<0||c<0||r>=n||c>=n){ nc.length=0; break; } nc.push(r*n+c); }
    if(nc.length===len && placeOk(n,P.ships,nc,S.game.cfg.touch,si)){ sh.cells=nc.sort((a,b)=>a-b); vib(15); render(); return; } }
  toast("Здесь не повернуть — мешает край поля или другой корабль");
}
async function markReady(){
  const P=S.place; if(!P.ships.every(s=>s.cells)) return;
  const ships=P.ships.map(s=>({len:s.len, cells:s.cells.slice()})); const ver=S.game.cfgVer;
  S.myFleet={cfgVer:ver, ships};
  if(S.mode==="bot"){ S.fleets[ME.pid]=ships; return pUpdate({ready:true, cfgVer:ver}); }
  try{ await BE.set(GP(S.code)+"/f/"+ME.pid, {d:enc(ships, fkey(S.code,ME.pid)), cfgVer:ver}); await pUpdate({ready:true, cfgVer:ver}); }catch(e){ writeErr(e); }
}
async function startGame(){
  const g=S.game; if(!isHost() || g.status!=="lobby" || !cfgFits(g.cfg)) return;
  let ps = Object.entries(S.players).filter(([p,v])=>v.bot || readyOf(p)).sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0)).map(([p])=>p);
  if(ps.length<2){ toast("Нужно минимум два готовых игрока","err"); return; }
  if(S.mode==="online"){ const free=Object.keys(S.players).filter(p=>!ps.includes(p)).length; if(free && !S.confirmStart){ S.confirmStart=true; toast(`Не готовы: ${free}. Нажмите «Начать бой» ещё раз, чтобы начать без них`); setTimeout(()=>{ if(S) S.confirmStart=false; },6000); return; } }
  const order = g.cfg.randomOrder ? shuffle(ps) : ps;
  const n=g.cfg.size, boards={}, stats={}, names={};
  order.forEach(p=>{ boards[p]={m:".".repeat(n*n), sunk:[], dead:false, place:0}; stats[p]={shots:0,hits:0,sunk:0}; const v=S.players[p]; names[p]={nick:v.nick||"Игрок", color:v.color||"#888", bot:!!v.bot}; });
  const now=Date.now();
  const patch={status:"playing", order, turnIdx:0, turnSeq:1, turnStartedAt:now, shotsLeft:g.cfg.shots, boards, stats, names, log:[{t:now, sys:"start"}], lastShot:null};
  if(S.mode==="bot"){ order.forEach(p=>{ if(S.players[p].bot) S.fleets[p]=randomFleet(g.cfg); }); onGame(Object.assign(clone(g), patch)); return; }
  await loadFleets(); const miss=order.filter(p=>!S.fleets[p]); if(miss.length){ toast("Не у всех сохранилась расстановка, подождите пару секунд","err"); return; }
  const code=S.code, ver=g.cfgVer;
  try{ const r=await BE.transact(GP(code)+"/g", cur=>{ if(cur===null) return null; const c=normG(cur); if(c.status!=="lobby" || c.cfgVer!==ver) return; return clone(Object.assign(c, patch)); });
    if(!r.committed) toast("Правила только что изменились — проверьте и начните снова"); }catch(e){ writeErr(e); }
}
async function fireAt(target, idx){
  const g=S.game; if(S.busy || g.status!=="playing" || curPid(g)!==ME.pid) return;
  if(!g.order.includes(target) || target===ME.pid || g.boards[target].dead || g.boards[target].m[idx]!==".") return;
  S.busy=true; sfx.shot();
  try{
    if(S.mode==="bot"){ const res=applyShot(S.game, S.fleets, ME.pid, target, idx); if(res) onGame(res.g); return; }
    if(!S.fleets[target]) await loadFleets();
    if(!S.fleets[target]){ toast("Не удалось прочитать поле соперника, откройте комнату заново","err"); return; }
    const code=S.code, fleets=S.fleets;
    await BE.transact(GP(code)+"/g", cur=>{ if(cur===null) return null; const c=normG(cur); if(c.status!=="playing" || curPid(c)!==ME.pid || !c.boards[target] || c.boards[target].m[idx]!==".") return; const res=applyShot(c, fleets, ME.pid, target, idx); return res ? clone(res.g) : undefined; });
  }catch(e){ writeErr(e); } finally{ if(S) S.busy=false; }
}
function tickTimer(){
  if(!S || S.game.status!=="playing") return; const g=S.game, lim=g.cfg.turnLimit; if(!lim) return; const el=$("#turnTimer");
  const left=Math.ceil((g.turnStartedAt+lim*1000-Date.now())/1000);
  if(el){ el.textContent="⏱ "+fmtTime(Math.max(0,left)); el.classList.toggle("low", left<=10); }
  if(left<=5 && left>0 && lim<=300 && curPid(g)===ME.pid) sfx.tick();
  if(left<=-2 && !S.skipping) trySkip();
}
setInterval(tickTimer, 1000);
async function trySkip(){

    if(S.mode==="bot"){ onGame(skipTurn(g)); return; }
    await BE.transact(GP(S.code)+"/g", cur=>{ if(cur===null) return null; const c=normG(cur); if(c.status!=="playing" || c.turnSeq!==seq) return; return clone(skipTurn(c)); });
  }catch(e){ console.warn(e); } finally{ setTimeout(()=>{ if(S) S.skipping=false; }, 4000); }
}
function startBotGame(keepCfg){

  if(S) closeGame();
  const cfg=keepCfg ? clone(keepCfg) : Object.assign(clone(DEFAULT_CFG), LS.get("mb.lastcfg",{})); cfg.maxPlayers=4;
  S={mode:"bot", code:"BOT", game:normG(newGameDoc("BOT",cfg)), players:{}, fleets:{}, myFleet:null, online:new Set(), unsub:[], botN:LS.get("mb.botN",1), botDiff:LS.get("mb.botDiff","normal")};

function setBots(){ const keep=S.players[ME.pid]; const p={}; p[ME.pid]=Object.assign({nick:ME.nick, color:ME.color, ready:false, cfgVer:0, joinedAt:1}, keep||{});
  const cols=PCOLORS.filter(c=>c!==ME.color); for(let k=0;k<S.botN;k++) p["bot"+k]={nick:BOT_NAMES[k], color:cols[k*2%cols.length], bot:true, ready:true, joinedAt:2+k};
  S.players=p; }
function scheduleBot(){
  const g=S.game; clearTimeout(S.botTimer); if(g.status!=="playing") return; const cur=curPid(g); if(!g.names[cur] || !g.names[cur].bot) return;
  S.botTimer=setTimeout(()=>{ if(!S || S.mode!=="bot" || S.game.status!=="playing" || curPid(S.game)!==cur) return;
    if(!S.fleets[cur]) S.fleets[cur]=randomFleet(S.game.cfg);
    const [t,i]=botChoose(S.game, cur, S.botDiff); if(t==null || i==null) return; sfx.shot();

async function rematch(){

const CHAT_MAX=150, MEDIA_MAX=2600000;
let REC=null, VREC=null, PLAYING=null;

function hhmm(t){ const d=new Date(t); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function chatNick(pid){ return (S && (nick(S.game,pid))) || "Игрок"; }
function chatColor(pid){ return (S && pcolor(S.game,pid)) || "#888"; }
function chatPreview(m){ return m.type==="audio" ? "🎤 Голосовое сообщение" : m.type==="video" ? "⏺ Видеокружок" : String(m.text||"").slice(0,80); }
function chatInit(code){
  S.chat={msgs:{}, seen:LS.get("mb.chatseen."+code,0), open:false, media:{}, first:true};
  if(!BE.listenLast) return;
  S.unsub.push(BE.listenLast(GP(code)+"/c", CHAT_MAX, v=>{ if(!S||S.code!==code) return;
    const prev=S.chat.msgs, now=v||{}; S.chat.msgs=now;

function blobToB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]||""); r.onerror=rej; r.readAsDataURL(blob); }); }
async function sendMedia(kind, blob, dur){
  if(!S||S.mode!=="online") return; const code=S.code;
  if(blob.size>MEDIA_MAX){ toast(kind==="video"?"Кружок получился слишком большим — запишите покороче":"Сообщение слишком длинное","err"); return; }
  toast(kind==="video"?"Отправляю кружок…":"Отправляю голосовое…");
  try{ const b64=await blobToB64(blob); const id=BE.pushKey(GP(code)+"/c");
    await BE.set(GP(code)+"/m/"+id, {mime:blob.type||"", data:b64});
    await BE.set(GP(code)+"/c/"+id, {by:ME.pid, at:Date.now(), type:kind, dur:dur, size:blob.size});
    if(S && S.chat) S.chat.media[id]=URL.createObjectURL(blob);
  }catch(e){ writeErr(e); }
}
function micError(e, what){ console.warn(e); const n=e&&e.name; toast(n==="NotAllowedError"||n==="SecurityError" ? `Нет доступа к ${what}. Разрешите его в настройках устройства для «Морского боя».` : n==="NotFoundError" ? `Не найден ${what==="камере"?"камера":"микрофон"}.` : `Не удалось включить ${what==="камере"?"камеру":"микрофон"}.`, "err"); }
async function startVoice(){
  if(REC||VREC) return;
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast("Запись голоса здесь не поддерживается","err"); return; }
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); }catch(e){ micError(e,"микрофону"); return; }
  const mime=pickMime(["audio/mp4;codecs=mp4a.40.2","audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"]);
  let rec; try{ rec=new MediaRecorder(stream, mime?{mimeType:mime, audioBitsPerSecond:32000}:{audioBitsPerSecond:32000}); }catch(e){ stream.getTracks().forEach(t=>t.stop()); toast("Запись голоса здесь не поддерживается","err"); return; }
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  REC={kind:"audio", rec, stream, chunks, t0:Date.now(), mime:rec.mimeType||mime||"audio/webm", max:120, timer:null};
  rec.start(250); vib(20);
  const c=$("#chatComp"); if(c) c.innerHTML=`<div class="recbar"><span class="recdot"></span><span id="recT" class="timer">0:00</span><span class="small muted">из 2:00</span><span class="sp"></span><button class="btn sm ghost" data-act="reccancel">Отмена</button><button class="btn sm primary" data-act="recsend">Отправить</button></div>`;
  REC.timer=setInterval(()=>{ if(!REC) return; const sec=Math.floor((Date.now()-REC.t0)/1000); const t=$("#recT"); if(t) t.textContent=fmtTime(sec); if(sec>=REC.max) stopRec(true); },250);
}
function stopRec(send){
  const R=REC; if(!R) return; REC=null; clearInterval(R.timer); const dur=Math.max(1,Math.round((Date.now()-R.t0)/1000));
  const done=()=>{ R.stream.getTracks().forEach(t=>t.stop()); const c=$("#chatComp"); if(c) c.innerHTML=composerHTML();
    if(!send) return; if(Date.now()-R.t0<700){ toast("Слишком коротко — говорите дольше"); return; }
    sendMedia("audio", new Blob(R.chunks,{type:(R.mime||"audio/webm").split(";")[0]}), dur); };
  R.rec.onstop=done; try{ R.rec.stop(); }catch(e){ done(); }
}
async function openVideoRec(facing){
  if(REC||(VREC&&!facing)) return;
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast("Видеокружки здесь не поддерживаются","err"); return; }
  facing=facing||LS.get("mb.facing","user");
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing, width:{ideal:480}, height:{ideal:480}}, audio:{echoCancellation:true, noiseSuppression:true}}); }catch(e){ micError(e,"камере"); return; }
  if(VREC){ VREC.stream.getTracks().forEach(t=>t.stop()); VREC.stream=stream; VREC.facing=facing; const v=$("#vprev"); v.srcObject=stream; v.classList.toggle("mirror", facing==="user"); v.play().catch(()=>{}); return; }
  const box=document.createElement("div"); box.className="vrec"; box.id="vrec";
  const R=46, C=2*Math.PI*R;
  box.innerHTML=`<div class="vtitle">Видеокружок · до 30 секунд</div>
    <div class="ring"><video id="vprev" class="${facing==="user"?"mirror":""}" playsinline autoplay muted></video><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${R}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="3"/><circle id="vprog" cx="50" cy="50" r="${R}" fill="none" stroke="#ff5b42" stroke-width="3.5" stroke-dasharray="${C}" stroke-dashoffset="${C}" stroke-linecap="round"/></svg></div>
    <div class="vtime timer" id="vtime">0:00</div>
    <div class="ctr"><button class="btn" data-act="vrecclose">Отмена</button><button class="recbtn" id="vgo" data-act="vrecgo" aria-label="Начать запись"></button><button class="btn" data-act="vrecflip" aria-label="Сменить камеру">⟲ Камера</button></div>
    <div class="vhint">Нажмите красную кнопку, чтобы начать, и ещё раз — чтобы отправить</div>`;
  document.body.appendChild(box);
  VREC={stream, facing, rec:null, chunks:[], t0:0, max:30, C, timer:null};
  const v=$("#vprev"); v.srcObject=stream; v.play().catch(()=>{});
}
function vrecToggle(){
  const V=VREC; if(!V) return;
  if(!V.rec){
    const mime=pickMime(["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4;codecs=avc1,mp4a.40.2","video/mp4","video/webm;codecs=vp8,opus","video/webm"]);
    try{ V.rec=new MediaRecorder(V.stream, mime?{mimeType:mime, videoBitsPerSecond:220000, audioBitsPerSecond:32000}:{videoBitsPerSecond:220000, audioBitsPerSecond:32000}); }catch(e){ toast("Запись видео здесь не поддерживается","err"); closeVideoRec(); return; }
    V.mime=V.rec.mimeType||mime||"video/webm"; V.rec.ondataavailable=e=>{ if(e.data && e.data.size) V.chunks.push(e.data); };
    V.rec.start(250); V.t0=Date.now(); vib(20); $("#vgo").classList.add("on"); $("#vgo").setAttribute("aria-label","Остановить и отправить");
    const hint=document.querySelector(".vrec .vhint"); if(hint) hint.textContent="Идёт запись. Нажмите ещё раз, чтобы отправить";
    V.timer=setInterval(()=>{ if(VREC!==V) return; const el=(Date.now()-V.t0)/1000; const pr=$("#vprog"); if(pr) pr.setAttribute("stroke-dashoffset", String(V.C*(1-Math.min(1,el/V.max)))); const t=$("#vtime"); if(t) t.textContent=fmtTime(Math.floor(el)); if(el>=V.max) vrecToggle(); },100);
    return; }
  clearInterval(V.timer); const dur=Math.max(1,Math.round((Date.now()-V.t0)/1000)); const short=Date.now()-V.t0<900;
  V.rec.onstop=()=>{ const blob=new Blob(V.chunks,{type:(V.mime||"video/webm").split(";")[0]}); closeVideoRec(); if(short){ toast("Слишком коротко"); return; } sendMedia("video", blob, dur); };
  try{ V.rec.stop(); }catch(e){ V.rec.onstop(); }
}
function vrecFlip(){ const V=VREC; if(!V || V.rec) return; const nf=V.facing==="user"?"environment":"user"; LS.set("mb.facing", nf); openVideoRec(nf); }
function closeVideoRec(){ const V=VREC; if(!V) return; VREC=null; clearInterval(V.timer); if(V.rec && V.rec.state==="recording"){ V.rec.onstop=null; try{ V.rec.stop(); }catch(e){} } V.stream.getTracks().forEach(t=>t.stop()); const b=$("#vrec"); if(b) b.remove(); }
async function mediaUrl(id){
  if(S.chat.media[id]) return S.chat.media[id];
  const v=await BE.get(GP(S.code)+"/m/"+id); if(!v || !v.data) throw new Error("нет файла");
  const bin=atob(v.data), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([u8],{type:v.mime||""})); S.chat.media[id]=url; return url;
}
async function playMedia(btn){
  if(!S||!S.chat) return; const id=btn.dataset.id, kind=btn.dataset.kind;
  if(PLAYING && PLAYING.id===id){ if(PLAYING.el.paused) PLAYING.el.play().catch(()=>{}); else PLAYING.el.pause(); return; }
  if(PLAYING){ try{ PLAYING.el.pause(); }catch(e){} PLAYING.btn.classList.remove("playing"); const pb=PLAYING.btn.querySelector(".pb"); if(pb) pb.textContent="▶"; PLAYING=null; }
  btn.classList.add("loading");
  let url; try{ url=await mediaUrl(id); }catch(e){ btn.classList.remove("loading"); toast("Не удалось загрузить сообщение — нет связи","err"); return; }
  btn.classList.remove("loading");
  const el = kind==="video" ? btn.querySelector("video") : new Audio();
  el.src=url; el.muted=false; PLAYING={id, el, btn};
  const bar=btn.querySelector(".abar i"), pb=btn.querySelector(".pb");
  el.onplay=()=>{ btn.classList.add("playing"); if(pb) pb.textContent="❚❚"; };
  el.onpause=()=>{ btn.classList.remove("playing"); if(pb) pb.textContent="▶"; };
  el.onended=()=>{ btn.classList.remove("playing"); if(pb) pb.textContent="▶"; if(bar) bar.style.width="0"; if(PLAYING && PLAYING.id===id) PLAYING=null; };
  el.ontimeupdate=()=>{ if(bar && el.duration && isFinite(el.duration)) bar.style.width=(el.currentTime/el.duration*100)+"%"; };
  el.play().catch(e=>{ console.warn(e); toast("Этот формат не воспроизводится на устройстве","err"); });
}

async function fillLeaders(){
  const box=$("#lbBody"); if(!box) return;
  const bs=LS.get("mb.botstat",{games:0,wins:0});
  const botLine = bs.games?`<p class="small">С ботами: побед ${bs.wins} из ${bs.games} (только на этом устройстве).</p>`:"";
  if(!BE){ box.innerHTML=botLine+`<p class="small">Общий рейтинг появится, когда настроен сервер.</p>`; return; }
  try{ const all=(await BE.get("mb1/results"))||{}; const agg={};
    Object.values(all).forEach(g=>{ arr(g.results).forEach(r=>{ if(!r || r.bot) return; const a=agg[r.id]||(agg[r.id]={nick:r.nick,color:r.color,games:0,wins:0,shots:0,hits:0,sunk:0,last:0}); a.games++; if(r.place===1) a.wins++; a.shots+=r.shots||0; a.hits+=r.hits||0; a.sunk+=r.sunk||0; if((g.finishedAt||0)>a.last){ a.last=g.finishedAt||0; a.nick=r.nick; a.color=r.color; } }); });
    const rows=Object.entries(agg).sort((a,b)=>b[1].wins-a[1].wins || (b[1].hits/(b[1].shots||1))-(a[1].hits/(a[1].shots||1)));
    if(!$("#lbBody")) return;
    $("#lbBody").innerHTML = botLine + (rows.length?`<div class="tscroll"><table><thead><tr><th class="num">#</th><th>Капитан</th><th class="num">Партии</th><th class="num">Победы</th><th class="num">Точность</th><th class="num">Потоплено</th></tr></thead><tbody>${rows.map(([id,a],i)=>`<tr><td class="num">${i+1}</td><td><span class="row" style="gap:8px;flex-wrap:nowrap"><span class="dot" style="background:${esc(a.color)}"></span>${esc(a.nick)}${id===ME.pid?" (вы)":""}</span></td><td class="num">${a.games}</td><td class="num"><b>${a.wins}</b></td><td class="num">${a.shots?Math.round(a.hits/a.shots*100):0}%</td><td class="num">${a.sunk}</td></tr>`).join("")}</tbody></table></div>`:`<p class="small">Пока нет завершённых партий по сети. Сыграйте первую!</p>`);
  }catch(e){ box.innerHTML=botLine+`<p class="small">Не удалось загрузить рейтинг — нет связи с сервером.</p>`; }
}

function wire(){
  document.addEventListener("click", e=>{
    const cell=e.target.closest(".c"); const board=cell&&cell.closest(".board");
    if(cell && board && S){ const i=+cell.dataset.i, k=board.dataset.kind;
      if(k==="place") return;
      if(k==="target") return fireAt(board.dataset.pid, i);
      return; }
    const a=e.target.closest("[data-act]"); if(!a) return; const f=ACT[a.dataset.act]; if(f) f(a,e);
  });
  document.addEventListener("pointerdown", ()=>sfx.unlock(), {once:true});
  document.addEventListener("pointerdown", e=>{ const b=e.target.closest && e.target.closest(".board.place"); if(b && e.button===0) placeDown(e, b); });
  document.addEventListener("pointermove", placeMove);
  document.addEventListener("pointerup", placeUp);
  document.addEventListener("pointercancel", e=>{ if(PG.st && e.pointerId===PG.st.id) placeCancel(); });
  document.addEventListener("contextmenu", e=>{ if(e.target.closest && e.target.closest(".board")) e.preventDefault(); });
  /* щипок двумя пальцами и Ctrl+колесо — размер клеток */
  let pinch=null; const tdist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  const setCell=c=>{ c=Math.round(Math.max(12, Math.min(64, c))); if(c!==SET.cell){ SET.cell=c; document.documentElement.style.setProperty("--cellPref", c+"px"); } };
  const onPinchMove=e=>{ if(pinch && e.touches.length===2){ e.preventDefault(); setCell(pinch.c0*tdist(e.touches)/pinch.d0); } };
  const onPinchEnd=e=>{ if(pinch && e.touches.length<2){ pinch=null; saveSet(); } };
  const pinchTargets=new WeakSet();
  document.addEventListener("touchstart", e=>{
    const t=e.target; if(t && t.nodeType===1 && !pinchTargets.has(t)){ pinchTargets.add(t); t.addEventListener("touchmove", onPinchMove, {passive:false}); t.addEventListener("touchend", onPinchEnd); t.addEventListener("touchcancel", onPinchEnd); }
    if(e.touches.length===2 && t.closest && t.closest(".bw")){ const c=document.querySelector(".bw .c"); pinch={d0:tdist(e.touches)||1, c0:c?c.getBoundingClientRect().width:SET.cell}; placeCancel(); e.preventDefault(); } }, {passive:false});
  document.addEventListener("gesturestart", e=>{ if(e.target.closest && e.target.closest(".bw")) e.preventDefault(); });
  document.addEventListener("wheel", e=>{ if(e.ctrlKey && e.target.closest && e.target.closest(".bw")){ e.preventDefault(); const c=document.querySelector(".bw .c"); setCell((c?c.getBoundingClientRect().width:SET.cell) + (e.deltaY<0?2:-2)); clearTimeout(window.__wz); window.__wz=setTimeout(saveSet,400); } }, {passive:false});
  document.addEventListener("keydown", e=>{
    if(e.key==="Escape"){ if(VREC) closeVideoRec(); else if(S && S.chat && S.chat.open) chatClose(); else if(OVL) closeOverlay(); }
    if(e.key==="Enter" && document.activeElement && document.activeElement.id==="chatIn"){ e.preventDefault(); chatSendText(); }
    if(e.key==="Enter" && document.activeElement && document.activeElement.id==="codeIn") ACT.join();
  });
  document.addEventListener("input", e=>{
    const t=e.target;
    if(t.id==="nickIn"){ ME.nick=t.value.trim().slice(0,18); saveMe(); return; }
    if(t.id==="codeIn"){ t.value=t.value.toUpperCase().replace(/[^A-Z0-9]/g,""); return; }
    if(t.dataset.set && t.type==="range"){ const k=t.dataset.set; SET[k]=+t.value; saveSet(); const lab=$("#s_"+k+"V"); if(lab) lab.textContent=t.value+({cell:"px",shipScale:"%",font:"px",fxIntensity:"×",botSpeed:" мс"}[k]||""); applySettings(); return; }
    if(t.dataset.color){ SET.colors[t.dataset.color]=t.value; saveSet(); applySettings(); return; }
  });
  document.addEventListener("change", e=>{
    const t=e.target;
    if(t.dataset.set && t.type==="checkbox"){ SET[t.dataset.set]=t.checked; saveSet(); applySettings(); if(t.dataset.set==="notify") PLAT.syncGames(); if(S) render(); return; }
    if(t.dataset.cfg){ const k=t.dataset.cfg; const v = t.type==="checkbox" ? t.checked : +t.value; editCfg(c=>{ c[k]=v; }); return; }
    if(t.dataset.bot){ if(t.dataset.bot==="n"){ S.botN=+t.value; LS.set("mb.botN",S.botN); setBots(); } else { S.botDiff=t.value; LS.set("mb.botDiff",S.botDiff); } render(); return; }
  });
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ clearInterval(titleTimer); document.title="Морской бой"; if(!S && BOOTED) fillMyGames(); } });
}

/* ================= запуск ================= */
async function boot(){
  wire();
  await PLAT.init();
  await storageInit();
  loadLocal();
  backendInit();
  BOOTED=true;
  render();
  PLAT.syncGames();
  const code=PLAT.launchCode();
  if(/^[A-Z0-9]{5}$/.test(code) && BE) openGame(code);
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
</script></body></html>
